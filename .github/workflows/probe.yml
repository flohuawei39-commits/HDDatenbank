name: Probe Web3Forms

# Wegwerf-Workflow. Klaert nur, ob Web3Forms Aufrufe von einem Server annimmt.
# Absichtlich mit ungueltigem Schluessel: es entsteht keine Mail.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Anfrage ohne gültigen Schlüssel
        run: |
          node -e '
          const koerper = { access_key: "00000000-0000-0000-0000-000000000000", subject: "Probe", from_name: "Probe", message: "Probe" };
          fetch("https://api.web3forms.com/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify(koerper)
          }).then(async (a) => {
            console.log("Status:", a.status);
            console.log("Antwort:", (await a.text()).slice(0, 300));
          }).catch((f) => console.log("Netzfehler:", f.message));
          '
